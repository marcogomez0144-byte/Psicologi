<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF7F2"/>
      <stop offset="100%" stop-color="#EFEAE1"/>
    </linearGradient>
    <linearGradient id="woodFloor" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DFD7CA"/>
      <stop offset="50%" stop-color="#E7E0D3"/>
      <stop offset="100%" stop-color="#D9D0C2"/>
    </linearGradient>
    <linearGradient id="sofaFabric" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E3DDD3"/>
      <stop offset="100%" stop-color="#CEC6B8"/>
    </linearGradient>
    <linearGradient id="pillowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7B8F7D"/>
      <stop offset="100%" stop-color="#556957"/>
    </linearGradient>
    <linearGradient id="terracottaVase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97A62"/>
      <stop offset="100%" stop-color="#B65A43"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Wall -->
  <rect width="1200" height="600" fill="url(#wallGrad)"/>

  <!-- Warm Sunlight Beam -->
  <polygon points="1200,0 850,0 300,800 1200,800" fill="#FFFDF8" opacity="0.45" filter="url(#softGlow)"/>

  <!-- Floor -->
  <rect y="580" width="1200" height="220" fill="url(#woodFloor)"/>
  <line x1="0" y1="580" x2="1200" y2="580" stroke="#C9BFB0" stroke-width="2"/>

  <!-- Window Frame Hint (Arch) -->
  <path d="M920,80 C920,40 980,40 980,80 L980,460 C980,460 920,460 920,460 Z" fill="#FFFFFF" opacity="0.6"/>
  <path d="M1000,80 C1000,40 1060,40 1060,80 L1060,460 C1060,460 1000,460 1000,460 Z" fill="#FFFFFF" opacity="0.6"/>

  <!-- Large Botanic Plant (Monstera / Ficus) -->
  <g transform="translate(180, 240)">
    <!-- Terracotta Pot -->
    <path d="M40,280 L10,420 C10,430 90,430 90,420 L60,280 Z" fill="url(#terracottaVase)"/>
    <!-- Organic Leaves in Sage Green -->
    <path d="M50,280 C20,200 -40,180 -70,220 C-90,250 -30,280 40,290 Z" fill="#5F7662" opacity="0.95"/>
    <path d="M50,260 C70,160 140,140 160,190 C170,230 110,270 50,280 Z" fill="#4B604E"/>
    <path d="M50,240 C30,110 -10,70 -50,90 C-80,110 -60,190 40,250 Z" fill="#758B78"/>
    <path d="M50,220 C80,90 150,80 180,120 C190,160 120,220 50,240 Z" fill="#5A705D"/>
    <path d="M50,190 C45,60 70,20 60,0 C40,20 10,70 50,200 Z" fill="#3D5040"/>
  </g>

  <!-- Cozy Therapy Armchair -->
  <g transform="translate(480, 260)">
    <!-- Backrest -->
    <path d="M50,140 C50,60 250,60 250,140 L265,300 C265,310 35,310 35,300 Z" fill="url(#sofaFabric)"/>
    <!-- Seat Cushion -->
    <rect x="20" y="270" width="260" height="70" rx="35" fill="#DDD6CA"/>
    <!-- Armrests -->
    <rect x="5" y="210" width="45" height="110" rx="22" fill="#D5CDBF"/>
    <rect x="250" y="210" width="45" height="110" rx="22" fill="#D5CDBF"/>
    <!-- Wooden Legs -->
    <line x1="45" y1="340" x2="30" y2="400" stroke="#8C7A65" stroke-width="8" stroke-linecap="round"/>
    <line x1="255" y1="340" x2="270" y2="400" stroke="#8C7A65" stroke-width="8" stroke-linecap="round"/>
    <!-- Sage Green Velvet Cushion -->
    <rect x="75" y="200" width="85" height="85" rx="20" fill="url(#pillowGrad)" transform="rotate(-8 115 240)"/>
    <!-- Terracotta Throw Plaid -->
    <path d="M190,220 C220,220 230,260 235,320 C235,340 210,345 200,320 Z" fill="url(#terracottaVase)" opacity="0.9"/>
  </g>

  <!-- Wooden Coffee Table with Tea and Notebook -->
  <g transform="translate(820, 420)">
    <!-- Table Top -->
    <ellipse cx="70" cy="80" rx="70" ry="24" fill="#CBBFAA"/>
    <!-- Legs -->
    <line x1="30" y1="95" x2="20" y2="180" stroke="#7A6854" stroke-width="6" stroke-linecap="round"/>
    <line x1="110" y1="95" x2="120" y2="180" stroke="#7A6854" stroke-width="6" stroke-linecap="round"/>
    <line x1="70" y1="100" x2="70" y2="175" stroke="#7A6854" stroke-width="5" stroke-linecap="round"/>
    <!-- Ceramic Cup -->
    <path d="M50,65 L53,78 C53,82 67,82 67,78 L70,65 Z" fill="#FFFFFF"/>
    <!-- Open Therapy Journal -->
    <polygon points="80,72 105,66 120,74 95,80" fill="#FAF8F5" stroke="#D1C8BA" stroke-width="1.5"/>
  </g>

  <!-- Editorial Watermark / Placeholder Label -->
  <rect x="40" y="40" width="380" height="46" rx="23" fill="#FFFFFF" opacity="0.88"/>
  <text x="60" y="69" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="600" fill="#3C4E3F" letter-spacing="0.5">
    ✦ ESPACIO DE CONSULTA · CALMA Y LUZ NATURAL
  </text>
</svg>
