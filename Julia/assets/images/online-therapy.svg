<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F9F6F0"/>
      <stop offset="100%" stop-color="#EBE3D7"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="#FAF8F5"/>
  
  <!-- Laptop device container -->
  <rect x="220" y="160" width="360" height="230" rx="14" fill="#3D453E"/>
  <rect x="232" y="172" width="336" height="206" rx="8" fill="url(#screenGrad)"/>
  <!-- Base of laptop -->
  <path d="M170,390 L630,390 L610,406 L190,406 Z" fill="#B0A493"/>
  <rect x="360" y="390" width="80" height="6" rx="3" fill="#D3C9BC"/>

  <!-- Inside Screen: Video call interface -->
  <rect x="250" y="190" width="140" height="95" rx="8" fill="#FFFFFF" stroke="#E3DACF"/>
  <circle cx="320" cy="225" r="18" fill="#DFD7CA"/>
  <path d="M290,265 C290,245 350,245 350,265 Z" fill="#758A77"/>

  <!-- Client Mini Picture-in-picture -->
  <rect x="440" y="270" width="110" height="75" rx="8" fill="#FAF8F5" stroke="#D5CCC0"/>
  <circle cx="495" cy="298" r="14" fill="#E8E0D5"/>
  <path d="M472,330 C472,315 518,315 518,330 Z" fill="#C46851"/>

  <!-- Security Shield Overlay -->
  <g transform="translate(480, 205)">
    <circle cx="16" cy="16" r="16" fill="#5E7361"/>
    <path d="M12,16 L15,19 L21,13" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Editorial Text -->
  <text x="400" y="470" text-anchor="middle" font-family="'Playfair Display', Georgia, serif" font-size="18" fill="#232924">
    Terapia Online Segura y Confidencial
  </text>
  <text x="400" y="495" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" fill="#5E7361" letter-spacing="1">
    CONEXIÓN CIFRADA · COMODIDAD DESDE TU ESPACIO
  </text>
</svg>
