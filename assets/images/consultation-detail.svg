<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="warmLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF8F5"/>
      <stop offset="100%" stop-color="#ECE5DA"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#warmLight)"/>
  
  <!-- Shelf -->
  <rect x="150" y="380" width="500" height="18" rx="4" fill="#C5B8A5"/>
  <rect x="180" y="398" width="16" height="40" fill="#B3A591"/>
  <rect x="600" y="398" width="16" height="40" fill="#B3A591"/>

  <!-- Books on Shelf -->
  <rect x="200" y="240" width="35" height="140" rx="3" fill="#5E7361"/>
  <rect x="240" y="260" width="28" height="120" rx="3" fill="#8C7A65"/>
  <rect x="272" y="250" width="40" height="130" rx="3" fill="#C46851"/>
  <rect x="316" y="270" width="30" height="110" rx="3" fill="#DDD6CA"/>
  
  <!-- Stacked Books -->
  <rect x="440" y="350" width="110" height="28" rx="2" fill="#FAF8F5" stroke="#DDD5C8"/>
  <rect x="450" y="325" width="95" height="24" rx="2" fill="#758A77"/>

  <!-- Ceramic Plant Pot with Eucalyptus -->
  <g transform="translate(560, 290)">
    <path d="M15,90 L30,40 L60,40 L75,90 Z" fill="#E8DFD3" stroke="#D3C7B7" stroke-width="1.5"/>
    <path d="M45,40 C45,-20 10,-50 15,-90" fill="none" stroke="#5E7361" stroke-width="2.5"/>
    <ellipse cx="28" cy="-10" rx="14" ry="9" fill="#758A77" transform="rotate(-20 28 -10)"/>
    <ellipse cx="14" cy="-55" rx="13" ry="8" fill="#5E7361" transform="rotate(15 14 -55)"/>
    <ellipse cx="22" cy="-85" rx="11" ry="7" fill="#8AA08C" transform="rotate(-30 22 -85)"/>
  </g>

  <!-- Editorial Text -->
  <text x="400" y="520" text-anchor="middle" font-family="'Playfair Display', Georgia, serif" font-size="18" fill="#232924">
    Consulta Presencial en [CIUDAD]
  </text>
  <text x="400" y="545" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" fill="#5E7361" letter-spacing="1">
    UN ENTORNO SEGURO, SILENCIOSO Y LUMINOSO
  </text>
</svg>
